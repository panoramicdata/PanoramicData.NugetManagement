<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Service Starting</title>
	<style>
		*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

		html, body {
			height: 100%;
			background: #0d1117;
		}

		body {
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			color: #e6edf3;
		}

		.container {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 28px;
			user-select: none;
			padding: 24px;
		}

		.spinner-wrap {
			position: relative;
			width: 176px;
			height: 176px;
		}

		.ring-outer,
		.ring-inner {
			position: absolute;
			inset: 0;
			border-radius: 50%;
			animation: spin 1.8s linear infinite;
		}

		.ring-outer {
			border: 3px solid transparent;
			border-top-color: #5ab4f3;
			border-left-color: #5ab4f355;
			animation-duration: 2.2s;
			animation-direction: reverse;
		}

		.ring-inner {
			inset: 10px;
			border: 3px solid transparent;
			border-top-color: #8ecff8;
			border-right-color: #8ecff8aa;
			animation-duration: 1.1s;
		}

		@keyframes spin {
			to { transform: rotate(360deg); }
		}

		.logo-bg {
			position: absolute;
			inset: 22px;
			border-radius: 50%;
			background: #161b22;
			border: 1px solid #21262d;
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow:
				0 0 0 1px #30363d,
				0 0 36px rgba(90, 180, 243, 0.2),
				inset 0 0 20px rgba(0, 0, 0, 0.4);
		}

		.logo-text {
			font-size: 15px;
			font-weight: 700;
			letter-spacing: 0.08em;
			color: #8ecff8;
		}

		.label {
			text-align: center;
			line-height: 1.5;
		}

		.label h2 {
			font-size: 16px;
			font-weight: 600;
			color: #c9d1d9;
		}

		.label p {
			margin-top: 4px;
			font-size: 12px;
			color: #8b949e;
			font-family: Consolas, "Courier New", monospace;
		}

		.tip {
			max-width: 680px;
			text-align: center;
			padding: 0 12px;
			line-height: 1.5;
			font-size: 14px;
			color: #9fb3c8;
		}

	</style>
</head>
<body>
	<div class="container">
		<div class="spinner-wrap">
			<div class="ring-outer"></div>
			<div class="ring-inner"></div>
			<div class="logo-bg">
				<div class="logo-text">PDM</div>
			</div>
		</div>

		<div class="label">
			<h2 id="status-title">Starting service...</h2>
			<p id="status-url">http://localhost:5023</p>
		</div>

		<div class="tip" id="tip">Preparing NuGet Management in the editor browser. This page will switch automatically when the app is ready.</div>
	</div>

	<script>
		var params = new URLSearchParams(window.location.search);
		var targetUrl = params.get("target") || "http://localhost:5023";
		var appName = params.get("app") || "NuGet Management";

		document.title = appName + " - Starting";
		document.getElementById("status-title").textContent = "Starting " + appName + "...";
		document.getElementById("status-url").textContent = targetUrl;

		(function probe() {
			fetch(targetUrl, { mode: "no-cors", cache: "no-store" })
				.then(function() {
					window.location.replace(targetUrl);
				})
				.catch(function() {
					setTimeout(probe, 1000);
				});
		})();
	</script>
</body>
</html>
